pre-push:
  commands:
    azure-gate:
      run: |
        set -euo pipefail
        make format-check
        make analyze
        make test

pre-commit:
  commands:
    flutter_lint_code:
      glob: "*.dart"
      exclude: "*.{g,freezed}.dart"
      run: |
        set -euo pipefail
        for file in {staged_files}; do
          if [ -f "$file" ]; then
            fvm dart fix --apply "$file"
          fi
        done
      stage_fixed: true

    format:
      glob: "*.dart"
      exclude: "*.{g,freezed}.dart"
      run: |
        set -euo pipefail
        FILES=""
        for file in {staged_files}; do
          if [ -f "$file" ]; then
            FILES="$FILES $file"
          fi
        done
        if [ -n "$FILES" ]; then
          fvm dart format --line-length=80 $FILES
        fi
      stage_fixed: true

    analyze:
      glob: "*.dart"
      exclude: "*.{g,freezed}.dart"
      run: |
        set -euo pipefail
        FILES=""
        for file in {staged_files}; do
          if [ -f "$file" ]; then
            FILES="$FILES $file"
          fi
        done
        if [ -n "$FILES" ]; then
          echo "Analyzing staged files:$FILES"
          fvm dart analyze $FILES --no-fatal-warnings --no-fatal-infos
        else
          echo "No staged Dart files to analyze."
        fi
