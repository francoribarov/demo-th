name: mobile_table_hopping
description: "Table Hopping - Board game rental app for Uruguay"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: 3.10.0

dependencies:
  bloc: 8.1.4
  cached_network_image: 3.4.1
  dio: 5.7.0
  equatable: 2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: 8.1.6
  freezed_annotation: 2.4.4
  get_it: 8.0.2
  go_router: 14.6.2
  injectable: 2.5.0
  intl: 0.19.0
  json_annotation: 4.9.0
  shared_preferences: 2.3.3
  shimmer: 3.0.0

dev_dependencies:
  bloc_test: 9.1.7
  build_runner: 2.4.13
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  freezed: 2.5.2
  injectable_generator: 2.6.2
  json_serializable: 6.8.0
  mocktail: 1.0.4
  very_good_analysis: 10.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
