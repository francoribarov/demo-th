name: mobile_table_hopping
description: "Table Hopping - Board game rental app for Uruguay"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  bloc: ^9.2.0
  cached_network_image: 3.4.1
  dartz: ^0.10.1
  dio: ^5.9.0
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  get_it: ^9.2.0
  go_router: ^17.0.1
  image_picker: ^1.0.7
  injectable: ^2.7.1+4
  intl: ^0.20.2
  json_annotation: 4.9.0
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.4.1
  shared_preferences: ^2.5.4
  shimmer: 3.0.0

dev_dependencies:
  analyzer: ^8.4.1
  bloc_test: ^10.0.0
  build_runner: ^2.10.4
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  injectable_generator: ^2.9.1
  json_serializable: ^6.11.2
  mocktail: 1.0.4
  retrofit_generator: ^10.2.1
  very_good_analysis: 10.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
