name: Pipeline

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: make format

      - name: Analyze
        run: make analyze

      - name: Test
        run: make test
