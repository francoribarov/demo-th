name: Pipeline

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'  # Synced with .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format
        run: make format

      - name: Analyze
        run: make analyze

      - name: Test
        run: make test
